name: Production CWV

on:
  push:
    branches: [codex/netlify-temporary]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cwv
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: mobile
            scenario: load
            cpu: 4
          - device: desktop
            scenario: load
            cpu: 1
          - device: mobile
            scenario: game
            cpu: 4
    env:
      CWV_BASE: https://theflames.app
      CWV_RELEASE: ${{ github.sha }}
      CWV_DEVICE: ${{ matrix.device }}
      CWV_SCENARIO: ${{ matrix.scenario }}
      CWV_CPU: ${{ matrix.cpu }}
      CWV_SLOW_NETWORK: 'true'
      CWV_INTERACT: 'true'
      CWV_TAG: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for this production revision
        run: node scripts/verify-cwv.mjs --wait-for-release
      - name: Measure and enforce CWV budgets
        run: node scripts/verify-cwv.mjs
      - name: Retain raw measurements and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cwv-${{ matrix.device }}-${{ matrix.scenario }}
          path: .cwv/
          if-no-files-found: warn
          retention-days: 7
