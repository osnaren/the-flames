<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
    <defs>
        <pattern id="pookalam" patternUnits="userSpaceOnUse" width="120" height="120">
            <!-- Central flower -->
            <circle cx="60" cy="60" r="6" fill="#DAA520" opacity="0.5" />

            <!-- Inner petals -->
            <ellipse cx="60" cy="45" rx="6" ry="10" fill="#FF6347" opacity="0.35" />
            <ellipse cx="60" cy="75" rx="6" ry="10" fill="#FF6347" opacity="0.35" />
            <ellipse cx="45" cy="60" rx="10" ry="6" fill="#FF6347" opacity="0.35" />
            <ellipse cx="75" cy="60" rx="10" ry="6" fill="#FF6347" opacity="0.35" />

            <!-- Diagonal petals -->
            <ellipse cx="49" cy="49" rx="5" ry="8" fill="#FFA500" opacity="0.3" transform="rotate(-45 49 49)" />
            <ellipse cx="71" cy="49" rx="5" ry="8" fill="#FFA500" opacity="0.3" transform="rotate(45 71 49)" />
            <ellipse cx="49" cy="71" rx="5" ry="8" fill="#FFA500" opacity="0.3" transform="rotate(45 49 71)" />
            <ellipse cx="71" cy="71" rx="5" ry="8" fill="#FFA500" opacity="0.3" transform="rotate(-45 71 71)" />

            <!-- Outer decorative circles -->
            <circle cx="60" cy="30" r="3" fill="#228B22" opacity="0.4" />
            <circle cx="60" cy="90" r="3" fill="#228B22" opacity="0.4" />
            <circle cx="30" cy="60" r="3" fill="#228B22" opacity="0.4" />
            <circle cx="90" cy="60" r="3" fill="#228B22" opacity="0.4" />

            <!-- Leaf accents -->
            <ellipse cx="20" cy="20" rx="4" ry="8" fill="#228B22" opacity="0.25" transform="rotate(-45 20 20)" />
            <ellipse cx="100" cy="20" rx="4" ry="8" fill="#228B22" opacity="0.25" transform="rotate(45 100 20)" />
            <ellipse cx="20" cy="100" rx="4" ry="8" fill="#228B22" opacity="0.25" transform="rotate(45 20 100)" />
            <ellipse cx="100" cy="100" rx="4" ry="8" fill="#228B22" opacity="0.25" transform="rotate(-45 100 100)" />
        </pattern>
    </defs>
    <rect width="120" height="120" fill="url(#pookalam)" />
</svg>
