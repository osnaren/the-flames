<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <defs>
        <pattern id="kolam" patternUnits="userSpaceOnUse" width="100" height="100">
            <!-- Central kolam dots -->
            <circle cx="50" cy="50" r="3" fill="#CD853F" opacity="0.5" />

            <!-- Inner ring of dots -->
            <circle cx="50" cy="35" r="2" fill="#CD853F" opacity="0.4" />
            <circle cx="50" cy="65" r="2" fill="#CD853F" opacity="0.4" />
            <circle cx="35" cy="50" r="2" fill="#CD853F" opacity="0.4" />
            <circle cx="65" cy="50" r="2" fill="#CD853F" opacity="0.4" />

            <!-- Curved lines connecting dots -->
            <path d="M50 35 Q65 42.5 65 50" fill="none" stroke="#228B22" stroke-width="0.8" opacity="0.35" />
            <path d="M65 50 Q57.5 65 50 65" fill="none" stroke="#228B22" stroke-width="0.8" opacity="0.35" />
            <path d="M50 65 Q35 57.5 35 50" fill="none" stroke="#228B22" stroke-width="0.8" opacity="0.35" />
            <path d="M35 50 Q42.5 35 50 35" fill="none" stroke="#228B22" stroke-width="0.8" opacity="0.35" />

            <!-- Outer dots -->
            <circle cx="50" cy="20" r="1.5" fill="#FF8C00" opacity="0.4" />
            <circle cx="50" cy="80" r="1.5" fill="#FF8C00" opacity="0.4" />
            <circle cx="20" cy="50" r="1.5" fill="#FF8C00" opacity="0.4" />
            <circle cx="80" cy="50" r="1.5" fill="#FF8C00" opacity="0.4" />

            <!-- Corner accents -->
            <circle cx="15" cy="15" r="2" fill="#CD853F" opacity="0.3" />
            <circle cx="85" cy="15" r="2" fill="#CD853F" opacity="0.3" />
            <circle cx="15" cy="85" r="2" fill="#CD853F" opacity="0.3" />
            <circle cx="85" cy="85" r="2" fill="#CD853F" opacity="0.3" />

            <!-- Diagonal connecting curves -->
            <path d="M15 15 Q32 25 35 50" fill="none" stroke="#CD853F" stroke-width="0.5" opacity="0.25" />
            <path d="M85 15 Q68 25 65 50" fill="none" stroke="#CD853F" stroke-width="0.5" opacity="0.25" />
        </pattern>
    </defs>
    <rect width="100" height="100" fill="url(#kolam)" />
</svg>
