<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <defs>
        <pattern id="color-splash" patternUnits="userSpaceOnUse" width="100" height="100">
            <!-- Pink splash -->
            <ellipse cx="25" cy="30" rx="12" ry="8" fill="#E91E63" opacity="0.3" transform="rotate(-15 25 30)" />

            <!-- Cyan splash -->
            <ellipse cx="70" cy="20" rx="10" ry="6" fill="#00BCD4" opacity="0.25" transform="rotate(20 70 20)" />

            <!-- Yellow splash -->
            <ellipse cx="50" cy="55" rx="14" ry="9" fill="#FFEB3B" opacity="0.35" transform="rotate(-10 50 55)" />

            <!-- Purple splash -->
            <ellipse cx="80" cy="65" rx="11" ry="7" fill="#9C27B0" opacity="0.28" transform="rotate(30 80 65)" />

            <!-- Green splash -->
            <ellipse cx="15" cy="75" rx="9" ry="6" fill="#4CAF50" opacity="0.25" transform="rotate(-25 15 75)" />

            <!-- Orange splash -->
            <ellipse cx="40" cy="85" rx="8" ry="5" fill="#FF5722" opacity="0.3" transform="rotate(15 40 85)" />

            <!-- Blue dots for powder effect -->
            <circle cx="60" cy="40" r="3" fill="#2196F3" opacity="0.4" />
            <circle cx="30" cy="50" r="2" fill="#2196F3" opacity="0.3" />

            <!-- Small accent dots -->
            <circle cx="85" cy="45" r="1.5" fill="#E91E63" opacity="0.5" />
            <circle cx="10" cy="15" r="2" fill="#FFEB3B" opacity="0.4" />
            <circle cx="95" cy="90" r="1.5" fill="#4CAF50" opacity="0.45" />
        </pattern>
    </defs>
    <rect width="100" height="100" fill="url(#color-splash)" />
</svg>
