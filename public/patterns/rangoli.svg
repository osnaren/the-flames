<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
    <defs>
        <pattern id="rangoli" patternUnits="userSpaceOnUse" width="120" height="120">
            <!-- Central mandala pattern -->
            <circle cx="60" cy="60" r="8" fill="none" stroke="#FFB300" stroke-width="1" opacity="0.4" />
            <circle cx="60" cy="60" r="16" fill="none" stroke="#D81B60" stroke-width="0.8" opacity="0.3" />
            <circle cx="60" cy="60" r="24" fill="none" stroke="#7B1FA2" stroke-width="0.6" opacity="0.25" />

            <!-- Petal dots around center -->
            <circle cx="60" cy="44" r="3" fill="#FFB300" opacity="0.5" />
            <circle cx="60" cy="76" r="3" fill="#FFB300" opacity="0.5" />
            <circle cx="44" cy="60" r="3" fill="#FFB300" opacity="0.5" />
            <circle cx="76" cy="60" r="3" fill="#FFB300" opacity="0.5" />

            <!-- Diagonal dots -->
            <circle cx="49" cy="49" r="2" fill="#D81B60" opacity="0.4" />
            <circle cx="71" cy="49" r="2" fill="#D81B60" opacity="0.4" />
            <circle cx="49" cy="71" r="2" fill="#D81B60" opacity="0.4" />
            <circle cx="71" cy="71" r="2" fill="#D81B60" opacity="0.4" />

            <!-- Outer decorative dots -->
            <circle cx="60" cy="32" r="1.5" fill="#7B1FA2" opacity="0.35" />
            <circle cx="60" cy="88" r="1.5" fill="#7B1FA2" opacity="0.35" />
            <circle cx="32" cy="60" r="1.5" fill="#7B1FA2" opacity="0.35" />
            <circle cx="88" cy="60" r="1.5" fill="#7B1FA2" opacity="0.35" />

            <!-- Corner accents -->
            <circle cx="20" cy="20" r="4" fill="none" stroke="#FFB300" stroke-width="0.5" opacity="0.3" />
            <circle cx="100" cy="20" r="4" fill="none" stroke="#FFB300" stroke-width="0.5" opacity="0.3" />
            <circle cx="20" cy="100" r="4" fill="none" stroke="#FFB300" stroke-width="0.5" opacity="0.3" />
            <circle cx="100" cy="100" r="4" fill="none" stroke="#FFB300" stroke-width="0.5" opacity="0.3" />
        </pattern>
    </defs>
    <rect width="120" height="120" fill="url(#rangoli)" />
</svg>
