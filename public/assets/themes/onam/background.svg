<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <defs>
        <linearGradient id="onamBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFFDE7" />
            <stop offset="50%" style="stop-color:#FFF8E1" />
            <stop offset="100%" style="stop-color:#FFF3E0" />
        </linearGradient>
        <radialGradient id="goldGlow" cx="30%" cy="30%">
            <stop offset="0%" style="stop-color:#FFD54F;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#FFD54F;stop-opacity:0" />
        </radialGradient>
        <radialGradient id="orangeGlow" cx="70%" cy="70%">
            <stop offset="0%" style="stop-color:#FF9800;stop-opacity:0.15" />
            <stop offset="100%" style="stop-color:#FF9800;stop-opacity:0" />
        </radialGradient>
        <radialGradient id="greenGlow" cx="80%" cy="25%">
            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.12" />
            <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:0" />
        </radialGradient>
    </defs>
    <rect width="800" height="600" fill="url(#onamBg)" />
    <circle cx="240" cy="180" r="220" fill="url(#goldGlow)" />
    <circle cx="560" cy="420" r="240" fill="url(#orangeGlow)" />
    <circle cx="640" cy="150" r="160" fill="url(#greenGlow)" />
</svg>
