<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Banana bunch (Nendhran style) -->
    <!-- Stem -->
    <rect x="28" y="4" width="8" height="12" fill="#4CAF50" />
    <ellipse cx="32" cy="16" rx="10" ry="4" fill="#388E3C" />
    <!-- Bananas -->
    <g fill="#FFD54F">
        <!-- Top row -->
        <path d="M22 18 Q18 28 22 38 Q26 40 28 36 Q24 26 26 18 Z" />
        <path d="M28 16 Q26 28 28 40 Q32 42 34 38 Q32 26 32 16 Z" />
        <path d="M36 16 Q38 28 36 40 Q32 42 30 38 Q32 26 32 16 Z" />
        <path d="M42 18 Q46 28 42 38 Q38 40 36 36 Q40 26 38 18 Z" />
    </g>
    <!-- Banana tips -->
    <g fill="#5D4037">
        <ellipse cx="22" cy="38" rx="2" ry="1" />
        <ellipse cx="29" cy="40" rx="2" ry="1" />
        <ellipse cx="35" cy="40" rx="2" ry="1" />
        <ellipse cx="42" cy="38" rx="2" ry="1" />
    </g>
    <!-- Lower bananas -->
    <g fill="#FFEB3B">
        <path d="M24 40 Q20 48 24 56 Q28 58 30 54 Q26 46 28 40 Z" />
        <path d="M32 40 Q30 50 32 60 Q36 62 38 58 Q36 48 36 40 Z" />
        <path d="M40 40 Q44 48 40 56 Q36 58 34 54 Q38 46 36 40 Z" />
    </g>
    <g fill="#5D4037">
        <ellipse cx="24" cy="56" rx="2" ry="1" />
        <ellipse cx="33" cy="60" rx="2" ry="1" />
        <ellipse cx="40" cy="56" rx="2" ry="1" />
    </g>
</svg>
