<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
    <!-- Pookalam flower arrangement -->
    <g transform="translate(15, 30)">
        <!-- Outer petals -->
        <ellipse cx="0" cy="-10" rx="4" ry="8" fill="#FFD54F" />
        <ellipse cx="0" cy="-10" rx="4" ry="8" fill="#FF9800" transform="rotate(60)" />
        <ellipse cx="0" cy="-10" rx="4" ry="8" fill="#FFD54F" transform="rotate(120)" />
        <ellipse cx="0" cy="-10" rx="4" ry="8" fill="#FF9800" transform="rotate(180)" />
        <ellipse cx="0" cy="-10" rx="4" ry="8" fill="#FFD54F" transform="rotate(240)" />
        <ellipse cx="0" cy="-10" rx="4" ry="8" fill="#FF9800" transform="rotate(300)" />
        <circle cx="0" cy="0" r="4" fill="#8B4513" />
    </g>
    <!-- Text -->
    <text x="40" y="42" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#FF9800">Onam</text>
    <!-- Decorations -->
    <circle cx="130" cy="22" r="4" fill="#FFD54F" />
    <circle cx="145" cy="38" r="3" fill="#4CAF50" />
    <circle cx="155" cy="25" r="3" fill="#FF9800" />
</svg>
