<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Traditional Kerala Umbrella (Olakuda) -->
    <!-- Umbrella canopy -->
    <ellipse cx="32" cy="20" rx="26" ry="12" fill="#D32F2F" />
    <path d="M6 20 Q32 36 58 20 Q32 28 6 20" fill="#B71C1C" />
    <!-- Decorative border -->
    <ellipse cx="32" cy="20" rx="26" ry="12" stroke="#FFD700" stroke-width="2" fill="none" />
    <!-- Umbrella ribs -->
    <g stroke="#8B4513" stroke-width="1">
        <line x1="32" y1="8" x2="32" y2="32" />
        <line x1="16" y1="14" x2="22" y2="30" />
        <line x1="48" y1="14" x2="42" y2="30" />
        <line x1="8" y1="20" x2="18" y2="28" />
        <line x1="56" y1="20" x2="46" y2="28" />
    </g>
    <!-- Handle -->
    <rect x="30" y="28" width="4" height="28" fill="#8B4513" />
    <ellipse cx="32" cy="58" rx="4" ry="2" fill="#5D4037" />
    <!-- Decorative patterns on canopy -->
    <g fill="#FFD700" opacity="0.6">
        <circle cx="20" cy="18" r="2" />
        <circle cx="32" cy="16" r="2" />
        <circle cx="44" cy="18" r="2" />
    </g>
    <!-- Gold trim -->
    <path d="M8 22 Q32 32 56 22" stroke="#FFD700" stroke-width="1.5" fill="none" />
</svg>
