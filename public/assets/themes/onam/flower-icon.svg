<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Flower (Thumba/Neelakurinji style) -->
    <g transform="translate(32, 32)">
        <!-- Petals -->
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#FFD54F" />
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#FFC107" transform="rotate(45)" />
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#FFD54F" transform="rotate(90)" />
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#FFC107" transform="rotate(135)" />
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#FFD54F" transform="rotate(180)" />
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#FFC107" transform="rotate(225)" />
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#FFD54F" transform="rotate(270)" />
        <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#FFC107" transform="rotate(315)" />
    </g>
    <!-- Inner petals -->
    <g transform="translate(32, 32)">
        <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#FF9800" transform="rotate(22.5)" />
        <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#FF9800" transform="rotate(67.5)" />
        <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#FF9800" transform="rotate(112.5)" />
        <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#FF9800" transform="rotate(157.5)" />
        <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#FF9800" transform="rotate(202.5)" />
        <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#FF9800" transform="rotate(247.5)" />
        <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#FF9800" transform="rotate(292.5)" />
        <ellipse cx="0" cy="-10" rx="5" ry="8" fill="#FF9800" transform="rotate(337.5)" />
    </g>
    <!-- Center -->
    <circle cx="32" cy="32" r="6" fill="#8B4513" />
    <circle cx="32" cy="32" r="3" fill="#A0522D" />
</svg>
