<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <!-- Scattered flowers pattern -->
    <g opacity="0.4">
        <!-- Flower 1 -->
        <g transform="translate(25, 25)">
            <ellipse cx="0" cy="-8" rx="4" ry="7" fill="#FFD54F" />
            <ellipse cx="0" cy="-8" rx="4" ry="7" fill="#FFD54F" transform="rotate(72)" />
            <ellipse cx="0" cy="-8" rx="4" ry="7" fill="#FFD54F" transform="rotate(144)" />
            <ellipse cx="0" cy="-8" rx="4" ry="7" fill="#FFD54F" transform="rotate(216)" />
            <ellipse cx="0" cy="-8" rx="4" ry="7" fill="#FFD54F" transform="rotate(288)" />
            <circle cx="0" cy="0" r="3" fill="#FF9800" />
        </g>
        <!-- Flower 2 -->
        <g transform="translate(75, 70)">
            <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#E91E63" />
            <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#E91E63" transform="rotate(60)" />
            <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#E91E63" transform="rotate(120)" />
            <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#E91E63" transform="rotate(180)" />
            <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#E91E63" transform="rotate(240)" />
            <ellipse cx="0" cy="-6" rx="3" ry="5" fill="#E91E63" transform="rotate(300)" />
            <circle cx="0" cy="0" r="2" fill="#FFC107" />
        </g>
        <!-- Loose petals -->
        <ellipse cx="60" cy="25" rx="4" ry="8" fill="#9C27B0" transform="rotate(-30 60 25)" />
        <ellipse cx="20" cy="75" rx="3" ry="6" fill="#4CAF50" transform="rotate(20 20 75)" />
    </g>
</svg>
