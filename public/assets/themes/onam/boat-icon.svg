<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Vallam Kali Snake Boat -->
    <!-- Boat hull -->
    <path d="M4 40 Q32 52 60 40 Q58 44 32 48 Q6 44 4 40" fill="#8B4513" />
    <path d="M4 40 Q32 52 60 40 Q55 36 32 42 Q9 36 4 40" fill="#A0522D" />
    <!-- Boat interior -->
    <path d="M8 40 Q32 48 56 40 Q52 38 32 44 Q12 38 8 40" fill="#D7CCC8" />
    <!-- Raised bow (snake head shape) -->
    <path d="M4 40 Q0 32 6 24 Q10 28 8 36 L4 40" fill="#8B4513" />
    <circle cx="6" cy="26" r="2" fill="#1a1a1a" />
    <!-- Raised stern -->
    <path d="M60 40 Q64 34 62 28 Q58 30 58 36 L60 40" fill="#8B4513" />
    <!-- Rowers (simplified) -->
    <g fill="#FFD54F">
        <ellipse cx="18" cy="38" rx="3" ry="2" />
        <ellipse cx="28" cy="40" rx="3" ry="2" />
        <ellipse cx="38" cy="40" rx="3" ry="2" />
        <ellipse cx="48" cy="38" rx="3" ry="2" />
    </g>
    <!-- Oars -->
    <g stroke="#8B4513" stroke-width="2">
        <line x1="18" y1="38" x2="12" y2="50" />
        <line x1="28" y1="40" x2="24" y2="52" />
        <line x1="38" y1="40" x2="42" y2="52" />
        <line x1="48" y1="38" x2="54" y2="50" />
    </g>
    <!-- Water -->
    <g fill="#2196F3" opacity="0.5">
        <ellipse cx="20" cy="54" rx="8" ry="2" />
        <ellipse cx="44" cy="54" rx="8" ry="2" />
    </g>
</svg>
