<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
    <!-- Clock symbol -->
    <g transform="translate(8, 30)">
        <circle cx="12" cy="0" r="12" fill="#1A237E" />
        <circle cx="12" cy="0" r="10" stroke="#FFD700" stroke-width="1.5" fill="none" />
        <line x1="12" y1="0" x2="12" y2="-6" stroke="#FFD700" stroke-width="2" stroke-linecap="round" />
        <line x1="12" y1="0" x2="12" y2="-4" stroke="#F5F5F5" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="12" cy="0" r="1.5" fill="#FFD700" />
    </g>
    <!-- Text -->
    <text x="35" y="42" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1A237E">New Year</text>
    <!-- Sparkles -->
    <circle cx="160" cy="20" r="3" fill="#FFD700" />
    <circle cx="175" cy="35" r="2" fill="#E91E63" />
    <circle cx="185" cy="22" r="2" fill="#4CAF50" />
</svg>
