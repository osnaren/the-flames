<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Champagne bottle -->
    <rect x="24" y="24" width="16" height="36" rx="4" fill="#1B5E20" />
    <rect x="26" y="28" width="12" height="30" rx="2" fill="#2E7D32" />
    <!-- Bottle neck -->
    <rect x="28" y="16" width="8" height="10" rx="2" fill="#1B5E20" />
    <!-- Cork/cap -->
    <rect x="27" y="10" width="10" height="8" rx="3" fill="#FFD700" />
    <!-- Bottle label -->
    <rect x="26" y="38" width="12" height="10" rx="1" fill="#F5F5F5" />
    <rect x="28" y="40" width="8" height="2" fill="#FFD700" />
    <rect x="29" y="44" width="6" height="1" fill="#1B5E20" />
    <!-- Bubbles/fizz coming out -->
    <g opacity="0.8">
        <circle cx="32" cy="6" r="3" fill="#FFD700" />
        <circle cx="26" cy="4" r="2" fill="#FFD700" />
        <circle cx="38" cy="2" r="2" fill="#FFD700" />
        <circle cx="24" cy="8" r="1.5" fill="#FFF59D" />
        <circle cx="40" cy="6" r="1.5" fill="#FFF59D" />
    </g>
    <!-- Glass reflection -->
    <rect x="28" y="30" width="2" height="20" rx="1" fill="white" opacity="0.3" />
</svg>
