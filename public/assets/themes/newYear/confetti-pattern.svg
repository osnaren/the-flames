<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <!-- Confetti pattern -->
    <g opacity="0.45">
        <!-- Rectangles -->
        <rect x="10" y="15" width="6" height="3" rx="0.5" fill="#E91E63" transform="rotate(-20 13 17)" />
        <rect x="75" y="10" width="5" height="2.5" rx="0.5" fill="#FFD700" transform="rotate(30 78 11)" />
        <rect x="45" y="5" width="6" height="2.5" rx="0.5" fill="#2196F3" transform="rotate(-10 48 6)" />
        <rect x="20" y="80" width="5" height="2.5" rx="0.5" fill="#4CAF50" transform="rotate(15 23 81)" />
        <rect x="65" y="75" width="6" height="3" rx="0.5" fill="#9C27B0" transform="rotate(-25 68 77)" />
        <!-- Circles -->
        <circle cx="30" cy="45" r="3" fill="#FFD700" />
        <circle cx="70" cy="40" r="2.5" fill="#E91E63" />
        <circle cx="15" cy="60" r="2" fill="#00BCD4" />
        <circle cx="85" cy="55" r="2.5" fill="#4CAF50" />
