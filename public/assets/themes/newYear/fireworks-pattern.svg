<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <!-- Fireworks pattern -->
    <g opacity="0.4">
        <!-- Firework 1 -->
        <g transform="translate(25, 30)">
            <line x1="0" y1="0" x2="0" y2="-15" stroke="#FFD700" stroke-width="2" />
            <line x1="0" y1="0" x2="12" y2="-8" stroke="#E91E63" stroke-width="2" />
            <line x1="0" y1="0" x2="12" y2="8" stroke="#2196F3" stroke-width="2" />
            <line x1="0" y1="0" x2="-12" y2="-8" stroke="#4CAF50" stroke-width="2" />
            <line x1="0" y1="0" x2="-12" y2="8" stroke="#9C27B0" stroke-width="2" />
            <circle cx="0" cy="0" r="3" fill="#FFF" />
        </g>
        <!-- Firework 2 -->
        <g transform="translate(75, 70)">
            <line x1="0" y1="0" x2="0" y2="-12" stroke="#E91E63" stroke-width="2" />
            <line x1="0" y1="0" x2="10" y2="-6" stroke="#FFD700" stroke-width="2" />
            <line x1="0" y1="0" x2="10" y2="6" stroke="#00BCD4" stroke-width="2" />
            <line x1="0" y1="0" x2="-10" y2="-6" stroke="#FF9800" stroke-width="2" />
            <line x1="0" y1="0" x2="-10" y2="6" stroke="#4CAF50" stroke-width="2" />
            <circle cx="0" cy="0" r="2.5" fill="#FFF" />
        </g>
    </g>
</svg>
