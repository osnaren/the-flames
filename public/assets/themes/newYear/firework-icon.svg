<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Firework burst -->
    <g stroke-linecap="round">
        <!-- Main rays with gradients -->
        <line x1="32" y1="32" x2="32" y2="4" stroke="#FFD700" stroke-width="3" />
        <line x1="32" y1="32" x2="32" y2="60" stroke="#FF6D00" stroke-width="3" />
        <line x1="32" y1="32" x2="4" y2="32" stroke="#E91E63" stroke-width="3" />
        <line x1="32" y1="32" x2="60" y2="32" stroke="#9C27B0" stroke-width="3" />
        <line x1="32" y1="32" x2="12" y2="12" stroke="#2196F3" stroke-width="3" />
        <line x1="32" y1="32" x2="52" y2="52" stroke="#4CAF50" stroke-width="3" />
        <line x1="32" y1="32" x2="52" y2="12" stroke="#00BCD4" stroke-width="3" />
        <line x1="32" y1="32" x2="12" y2="52" stroke="#FF9800" stroke-width="3" />
    </g>
    <!-- Spark dots at ends -->
    <circle cx="32" cy="4" r="4" fill="#FFD700" />
    <circle cx="32" cy="60" r="4" fill="#FF6D00" />
    <circle cx="4" cy="32" r="4" fill="#E91E63" />
    <circle cx="60" cy="32" r="4" fill="#9C27B0" />
    <circle cx="12" cy="12" r="3" fill="#2196F3" />
    <circle cx="52" cy="52" r="3" fill="#4CAF50" />
    <circle cx="52" cy="12" r="3" fill="#00BCD4" />
    <circle cx="12" cy="52" r="3" fill="#FF9800" />
    <!-- Center glow -->
    <circle cx="32" cy="32" r="6" fill="#FFFFFF" />
    <circle cx="32" cy="32" r="10" fill="#FFD700" opacity="0.3" />
    <!-- Extra sparkles -->
    <circle cx="22" cy="8" r="2" fill="#FFD700" />
    <circle cx="42" cy="8" r="2" fill="#FFD700" />
    <circle cx="56" cy="22" r="2" fill="#9C27B0" />
    <circle cx="8" cy="42" r="2" fill="#E91E63" />
</svg>
