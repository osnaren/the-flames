<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Clock face -->
    <circle cx="32" cy="32" r="28" fill="#1A237E" />
    <circle cx="32" cy="32" r="26" fill="#283593" />
    <circle cx="32" cy="32" r="24" stroke="#FFD700" stroke-width="2" fill="none" />
    <!-- Hour markers -->
    <g fill="#FFD700">
        <rect x="30" y="10" width="4" height="6" rx="1" />
        <rect x="30" y="48" width="4" height="6" rx="1" />
        <rect x="10" y="30" width="6" height="4" rx="1" />
        <rect x="48" y="30" width="6" height="4" rx="1" />
    </g>
    <!-- Minute markers -->
    <g fill="#9FA8DA">
        <circle cx="32" cy="12" r="1.5" />
        <circle cx="44" cy="16" r="1.5" />
        <circle cx="52" cy="24" r="1.5" />
        <circle cx="52" cy="40" r="1.5" />
        <circle cx="44" cy="48" r="1.5" />
        <circle cx="20" cy="48" r="1.5" />
        <circle cx="12" cy="40" r="1.5" />
        <circle cx="12" cy="24" r="1.5" />
        <circle cx="20" cy="16" r="1.5" />
    </g>
    <!-- Clock hands at midnight -->
    <line x1="32" y1="32" x2="32" y2="14" stroke="#FFD700" stroke-width="3" stroke-linecap="round" />
    <line x1="32" y1="32" x2="32" y2="18" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round" />
    <!-- Center dot -->
    <circle cx="32" cy="32" r="3" fill="#FFD700" />
    <circle cx="32" cy="32" r="1.5" fill="#1A237E" />
</svg>
