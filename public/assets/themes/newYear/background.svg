<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <defs>
        <linearGradient id="newYearBg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#0D1B2A" />
            <stop offset="50%" style="stop-color:#1B263B" />
            <stop offset="100%" style="stop-color:#1A237E" />
        </linearGradient>
        <radialGradient id="goldGlow1" cx="30%" cy="25%">
            <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
        </radialGradient>
        <radialGradient id="goldGlow2" cx="70%" cy="75%">
            <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.15" />
            <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
        </radialGradient>
        <radialGradient id="silverGlow" cx="80%" cy="20%">
            <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:0.12" />
            <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:0" />
        </radialGradient>
    </defs>
    <rect width="800" height="600" fill="url(#newYearBg)" />
    <circle cx="240" cy="150" r="200" fill="url(#goldGlow1)" />
    <circle cx="560" cy="450" r="220" fill="url(#goldGlow2)" />
    <circle cx="640" cy="120" r="150" fill="url(#silverGlow)" />
    <!-- Stars -->
    <g fill="#FFD700" opacity="0.4">
        <circle cx="100" cy="80" r="2" />
        <circle cx="200" cy="50" r="1.5" />
        <circle cx="350" cy="100" r="2" />
        <circle cx="500" cy="60" r="1.5" />
        <circle cx="650" cy="90" r="2" />
        <circle cx="750" cy="40" r="1.5" />
    </g>
</svg>
