<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <!-- Kolam pattern tile -->
    <g stroke="#CD853F" stroke-width="1.5" fill="none" opacity="0.4">
        <!-- Central design -->
        <circle cx="50" cy="50" r="20" />
        <circle cx="50" cy="50" r="10" />
        <!-- Corner curves -->
        <path d="M10 10 Q30 30 50 10" />
        <path d="M90 10 Q70 30 50 10" />
        <path d="M10 90 Q30 70 50 90" />
        <path d="M90 90 Q70 70 50 90" />
        <!-- Dots -->
        <circle cx="50" cy="50" r="3" fill="#CD853F" />
        <circle cx="25" cy="25" r="2" fill="#FF8C00" />
        <circle cx="75" cy="25" r="2" fill="#FF8C00" />
        <circle cx="25" cy="75" r="2" fill="#FF8C00" />
        <circle cx="75" cy="75" r="2" fill="#FF8C00" />
    </g>
</svg>
