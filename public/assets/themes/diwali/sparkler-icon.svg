<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Sparkler stick -->
    <rect x="30" y="40" width="4" height="24" fill="#8B4513" />
    <!-- Sparkler head -->
    <rect x="28" y="28" width="8" height="14" rx="2" fill="#555" />
    <!-- Sparks emanating -->
    <g stroke="#FFD700" stroke-width="2" stroke-linecap="round">
        <line x1="32" y1="28" x2="32" y2="12" />
        <line x1="32" y1="28" x2="48" y2="18" />
        <line x1="32" y1="28" x2="16" y2="18" />
        <line x1="32" y1="28" x2="50" y2="32" />
        <line x1="32" y1="28" x2="14" y2="32" />
        <line x1="32" y1="28" x2="44" y2="8" />
        <line x1="32" y1="28" x2="20" y2="8" />
    </g>
    <!-- Spark dots -->
    <circle cx="32" cy="10" r="3" fill="#FF6D00" />
    <circle cx="48" cy="16" r="2" fill="#FFD54F" />
    <circle cx="16" cy="16" r="2" fill="#FFD54F" />
    <circle cx="52" cy="30" r="2" fill="#FF8F00" />
    <circle cx="12" cy="30" r="2" fill="#FF8F00" />
    <circle cx="44" cy="6" r="2" fill="#FFB300" />
    <circle cx="20" cy="6" r="2" fill="#FFB300" />
    <!-- Glowing center -->
    <circle cx="32" cy="28" r="6" fill="#FFD700" />
    <circle cx="32" cy="28" r="3" fill="#FFFFFF" />
</svg>
