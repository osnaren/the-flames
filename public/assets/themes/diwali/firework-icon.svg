<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Firework burst -->
    <g stroke-linecap="round">
        <!-- Main rays -->
        <line x1="32" y1="32" x2="32" y2="4" stroke="#FFD700" stroke-width="3" />
        <line x1="32" y1="32" x2="32" y2="60" stroke="#FF6D00" stroke-width="3" />
        <line x1="32" y1="32" x2="4" y2="32" stroke="#D81B60" stroke-width="3" />
        <line x1="32" y1="32" x2="60" y2="32" stroke="#7B1FA2" stroke-width="3" />
        <line x1="32" y1="32" x2="12" y2="12" stroke="#FFB300" stroke-width="3" />
        <line x1="32" y1="32" x2="52" y2="52" stroke="#CE93D8" stroke-width="3" />
        <line x1="32" y1="32" x2="52" y2="12" stroke="#F48FB1" stroke-width="3" />
        <line x1="32" y1="32" x2="12" y2="52" stroke="#FFD54F" stroke-width="3" />
    </g>
    <!-- Spark dots at ends -->
    <circle cx="32" cy="4" r="4" fill="#FFD700" />
    <circle cx="32" cy="60" r="4" fill="#FF6D00" />
    <circle cx="4" cy="32" r="4" fill="#D81B60" />
    <circle cx="60" cy="32" r="4" fill="#7B1FA2" />
    <circle cx="12" cy="12" r="3" fill="#FFB300" />
    <circle cx="52" cy="52" r="3" fill="#CE93D8" />
    <circle cx="52" cy="12" r="3" fill="#F48FB1" />
    <circle cx="12" cy="52" r="3" fill="#FFD54F" />
    <!-- Center glow -->
    <circle cx="32" cy="32" r="6" fill="#FFFFFF" />
    <circle cx="32" cy="32" r="10" fill="#FFD700" opacity="0.3" />
</svg>
