<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Rangoli - colorful geometric pattern -->
    <circle cx="32" cy="32" r="28" stroke="#FFB300" stroke-width="2" fill="none" />
    <circle cx="32" cy="32" r="20" stroke="#D81B60" stroke-width="2" fill="none" />
    <circle cx="32" cy="32" r="12" stroke="#7B1FA2" stroke-width="2" fill="none" />
    <!-- Petals -->
    <g fill="#FFB300">
        <ellipse cx="32" cy="8" rx="4" ry="8" transform="rotate(0 32 32)" />
        <ellipse cx="32" cy="8" rx="4" ry="8" transform="rotate(45 32 32)" />
        <ellipse cx="32" cy="8" rx="4" ry="8" transform="rotate(90 32 32)" />
        <ellipse cx="32" cy="8" rx="4" ry="8" transform="rotate(135 32 32)" />
        <ellipse cx="32" cy="8" rx="4" ry="8" transform="rotate(180 32 32)" />
        <ellipse cx="32" cy="8" rx="4" ry="8" transform="rotate(225 32 32)" />
        <ellipse cx="32" cy="8" rx="4" ry="8" transform="rotate(270 32 32)" />
        <ellipse cx="32" cy="8" rx="4" ry="8" transform="rotate(315 32 32)" />
    </g>
    <!-- Inner petals -->
    <g fill="#D81B60">
        <ellipse cx="32" cy="16" rx="3" ry="6" transform="rotate(22.5 32 32)" />
        <ellipse cx="32" cy="16" rx="3" ry="6" transform="rotate(67.5 32 32)" />
        <ellipse cx="32" cy="16" rx="3" ry="6" transform="rotate(112.5 32 32)" />
        <ellipse cx="32" cy="16" rx="3" ry="6" transform="rotate(157.5 32 32)" />
        <ellipse cx="32" cy="16" rx="3" ry="6" transform="rotate(202.5 32 32)" />
        <ellipse cx="32" cy="16" rx="3" ry="6" transform="rotate(247.5 32 32)" />
        <ellipse cx="32" cy="16" rx="3" ry="6" transform="rotate(292.5 32 32)" />
        <ellipse cx="32" cy="16" rx="3" ry="6" transform="rotate(337.5 32 32)" />
    </g>
    <!-- Center -->
    <circle cx="32" cy="32" r="6" fill="#7B1FA2" />
    <circle cx="32" cy="32" r="3" fill="#FFD54F" />
</svg>
