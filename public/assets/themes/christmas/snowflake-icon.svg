<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <g stroke="#87CEEB" stroke-width="2.5" stroke-linecap="round">
        <!-- Main arms -->
        <line x1="32" y1="4" x2="32" y2="60" />
        <line x1="4" y1="32" x2="60" y2="32" />
        <line x1="12" y1="12" x2="52" y2="52" />
        <line x1="52" y1="12" x2="12" y2="52" />
        <!-- Branches on vertical arm -->
        <line x1="32" y1="12" x2="26" y2="6" />
        <line x1="32" y1="12" x2="38" y2="6" />
        <line x1="32" y1="52" x2="26" y2="58" />
        <line x1="32" y1="52" x2="38" y2="58" />
        <!-- Branches on horizontal arm -->
        <line x1="12" y1="32" x2="6" y2="26" />
        <line x1="12" y1="32" x2="6" y2="38" />
        <line x1="52" y1="32" x2="58" y2="26" />
        <line x1="52" y1="32" x2="58" y2="38" />
        <!-- Center decoration -->
        <circle cx="32" cy="32" r="4" fill="#E6F3FF" stroke="#87CEEB" />
    </g>
</svg>
