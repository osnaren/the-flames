<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <g opacity="0.5">
    <!-- Holly leaves and berries pattern -->
    <g transform="translate(50, 50)">
      <!-- Left leaf -->
      <ellipse cx="-12" cy="0" rx="10" ry="5" fill="#228B22" transform="rotate(-30)"/>
      <!-- Right leaf -->
      <ellipse cx="12" cy="0" rx="10" ry="5" fill="#228B22" transform="rotate(30)"/>
      <!-- Berries -->
      <circle cx="0" cy="-2" r="4" fill="#DC143C"/>
      <circle cx="-5" cy="3" r="3" fill="#DC143C"/>
      <circle cx="5" cy="3" r="3" fill="#DC143C"/>
    </g>
  </g>
</svg>
