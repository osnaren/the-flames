<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <defs>
        <linearGradient id="halloweenBg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#0D0D0D" />
            <stop offset="50%" style="stop-color:#1A1A2E" />
            <stop offset="100%" style="stop-color:#16213E" />
        </linearGradient>
        <radialGradient id="moonGlow" cx="80%" cy="15%">
            <stop offset="0%" style="stop-color:#FFEB3B;stop-opacity:0.3" />
            <stop offset="50%" style="stop-color:#FF9800;stop-opacity:0.1" />
            <stop offset="100%" style="stop-color:#FF9800;stop-opacity:0" />
        </radialGradient>
        <radialGradient id="purpleGlow" cx="20%" cy="80%">
            <stop offset="0%" style="stop-color:#7B1FA2;stop-opacity:0.15" />
            <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:0" />
        </radialGradient>
    </defs>
    <rect width="800" height="600" fill="url(#halloweenBg)" />
    <!-- Moon -->
    <circle cx="640" cy="90" r="60" fill="#FFEB3B" opacity="0.9" />
    <circle cx="640" cy="90" r="120" fill="url(#moonGlow)" />
    <!-- Purple atmosphere -->
    <circle cx="160" cy="480" r="250" fill="url(#purpleGlow)" />
</svg>
