<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
    <defs>
        <linearGradient id="holiBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FCE4EC" />
            <stop offset="50%" style="stop-color:#F3E5F5" />
            <stop offset="100%" style="stop-color:#E1F5FE" />
        </linearGradient>
        <radialGradient id="pinkGlow" cx="20%" cy="30%">
            <stop offset="0%" style="stop-color:#E91E63;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#E91E63;stop-opacity:0" />
        </radialGradient>
        <radialGradient id="purpleGlow" cx="70%" cy="20%">
            <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:0.15" />
            <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:0" />
        </radialGradient>
        <radialGradient id="yellowGlow" cx="80%" cy="70%">
            <stop offset="0%" style="stop-color:#FFEB3B;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#FFEB3B;stop-opacity:0" />
        </radialGradient>
        <radialGradient id="greenGlow" cx="30%" cy="80%">
            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.15" />
            <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:0" />
        </radialGradient>
    </defs>
    <rect width="800" height="600" fill="url(#holiBg)" />
    <circle cx="160" cy="180" r="200" fill="url(#pinkGlow)" />
    <circle cx="560" cy="120" r="180" fill="url(#purpleGlow)" />
    <circle cx="640" cy="420" r="200" fill="url(#yellowGlow)" />
    <circle cx="240" cy="480" r="180" fill="url(#greenGlow)" />
</svg>
