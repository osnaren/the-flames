<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Pichkari water gun -->
    <!-- Barrel -->
    <rect x="24" y="20" width="36" height="10" rx="3" fill="#E91E63" />
    <rect x="26" y="22" width="32" height="6" fill="#F48FB1" />
    <!-- Nozzle -->
    <rect x="56" y="22" width="8" height="6" rx="1" fill="#9C27B0" />
    <!-- Handle/Pump -->
    <rect x="8" y="18" width="20" height="14" rx="4" fill="#9C27B0" />
    <rect x="10" y="20" width="16" height="10" rx="3" fill="#CE93D8" />
    <!-- Trigger grip -->
    <rect x="18" y="32" width="8" height="16" rx="2" fill="#7B1FA2" />
    <rect x="20" y="34" width="4" height="12" rx="1" fill="#9C27B0" />
    <!-- Water spray -->
    <g opacity="0.8">
        <circle cx="60" cy="18" r="3" fill="#2196F3" />
        <circle cx="62" cy="12" r="2" fill="#2196F3" />
        <circle cx="58" cy="14" r="2.5" fill="#64B5F6" />
        <circle cx="56" cy="10" r="2" fill="#90CAF9" />
    </g>
    <!-- Decorative band -->
    <rect x="36" y="20" width="4" height="10" fill="#FFEB3B" />
</svg>
